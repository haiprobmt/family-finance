name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: e2e against the deployable single-file bundle
        run: npm run e2e
        env:
          FF_BACKEND: bundle

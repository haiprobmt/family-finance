plugins { id 'com.android.application' }

// Release signing comes from environment variables so no key or password is ever stored in git:
//   FF_KEYSTORE (path), FF_KEYSTORE_PASSWORD, FF_KEY_ALIAS, FF_KEY_PASSWORD
def ks = System.getenv('FF_KEYSTORE')
// The web app the wrapper opens. Default: GitHub Pages. For the family's own server, build with e.g.
//   FF_START_URL=https://my-vm.example.ts.net:8443/   (HTTPS only; keep private addresses out of git)
def startUrl = System.getenv('FF_START_URL') ?: 'https://haiprobmt.github.io/family-finance/'
if (!(startUrl ==~ /^https:\/\/[A-Za-z0-9.-]+(:\d+)?\/([A-Za-z0-9._~\/-]*\/)?$/)) throw new GradleException('FF_START_URL must be an https:// URL ending with /')

android {
    namespace 'io.github.haiprobmt.familyfinance'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.haiprobmt.familyfinance'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '3.1.0'
        buildConfigField 'String', 'START_URL', '"' + startUrl + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('FF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FF_KEY_ALIAS')
                keyPassword System.getenv('FF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
